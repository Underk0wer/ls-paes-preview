<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Participa — Limón Soda</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      background: #000;
    }

    /* Fondo: capas Assets/01/Fondo.png + Assets/02/Diablo.png (referencia: 02/Fondo_Formulario, 1920×1080).
       Mismo escenario que el index: cubre la pantalla como object-fit: cover y cada capa
       se ubica con sus px del lienzo 1920×1080 (--x, --y, --w). */
    .bg-comp { position: fixed; inset: 0; z-index: 0; overflow: hidden;
               --fx: 50%; }   /* punto focal horizontal (equivale a object-position) */
    .bg-stage {
      position: absolute; top: 50%; left: var(--fx);
      /* 5% extra = ~45 px de margen por lado (en px del lienzo): ningún data-depth
         del parallax debe superarlo, o se verán los bordes del fondo */
      width: calc(max(100vw, 100vh * 16 / 9) * 1.05);
      aspect-ratio: 16 / 9;
      transform: translate(calc(-1 * var(--fx)), -50%);
    }
    .bg-stage img {
      position: absolute;
      left:  calc(var(--x) / 1920 * 100%);
      top:   calc(var(--y) / 1080 * 100%);
      width: calc(var(--w) / 1920 * 100%);
      height: auto; display: block;
      pointer-events: none; user-select: none;
    }

    /* Humo: canvas dentro del escenario (lo dibuja humo.js) */
    .bg-humo {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
      animation: p1-fade 1.5s ease-out backwards;
    }

    /* Animaciones de entrada (fill-mode backwards: no dejan estilos pegados) */
    @keyframes p1-in    { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes p1-fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes btn-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* ===== Elementos de Pagina_2 ===== */
    .p2-panel  { position: fixed; z-index: 1; top: 8%;    left: 54%;   width: 41%; height: 72%;
                 animation: p1-fade 0.8s ease-out 0.20s backwards; }
    .p2-titulo { position: fixed; z-index: 2; top: 11.5%; left: 16%;   width: 26.5%;
                 animation: p1-in 0.7s ease-out 0.35s backwards; }
    .p2-slogan { position: fixed; z-index: 2; top: 73%;   left: 17.5%; width: 21%;
                 animation: p1-in 0.7s ease-out 0.50s backwards; }
    .p2-panel img { display: block; width: 100%; height: 100%; }
    .p2-titulo img, .p2-slogan img { display: block; width: 100%; height: auto; }

    /* --- Botón ENVIAR (Boton_2) ---
       Capas: wrapper (posición + entrada) > pulso > botón (crossfade + press) */
    .p2-enviar {
      position: fixed; z-index: 3; top: 86%; left: 59%; width: 14.5%;
      animation: p1-in 0.7s ease-out 0.90s backwards;
    }
    .p2-enviar-pulse { animation: btn-pulse 2.6s ease-in-out infinite; }
    /* el pulso se DETIENE al poner el cursor encima */
    .p2-enviar:hover .p2-enviar-pulse { animation-play-state: paused; }

    /* Capa BASE = Boton_2_P (se revela al presionar).
       ::before = normal (Boton_2), ::after = M (Boton_2_M, hover).
       Al presionar se ocultan ambas capas de arriba → queda SOLO P,
       sin que M quede duplicado con P. */
    .p2-enviar-btn {
      position: relative; display: block; width: 100%; aspect-ratio: 254 / 70;
      border: none; padding: 0; cursor: pointer;
      background: url("Assets/Pagina_2/Boton_2_P.svg") center / contain no-repeat;
      transition: transform 0.08s ease;
    }
    .p2-enviar-btn::before {   /* normal (Boton_2) */
      content: ""; position: absolute; inset: 0;
      background: url("Assets/Pagina_2/Boton_2.svg") center / contain no-repeat;
      opacity: 1; transition: opacity 0.35s ease; pointer-events: none;
    }
    .p2-enviar-btn::after {    /* M (hover) con fundido suave */
      content: ""; position: absolute; inset: 0;
      background: url("Assets/Pagina_2/Boton_2_M.svg") center / contain no-repeat;
      opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
    }
    .p2-enviar:hover .p2-enviar-btn::after { opacity: 1; }
    /* Al presionar: ocultar normal (::before) y M (::after) → solo se ve P (base) */
    .p2-enviar-btn:active::before { opacity: 0; transition: none; }
    .p2-enviar:hover .p2-enviar-btn:active::after { opacity: 0; transition: none; }
    .p2-enviar-btn:active { transform: translateY(2px) scale(0.98); }

    /* --- Botón BORRAR (Boton_3): entrada + press --- */
    .p2-borrar {
      position: fixed; z-index: 3; top: 86%; left: 75.5%; width: 14.5%; aspect-ratio: 254 / 70;
      border: none; padding: 0; cursor: pointer;
      background: url("Assets/Pagina_2/Boton_3.svg") center / contain no-repeat;
      transition: transform 0.08s ease;
      animation: p1-in 0.7s ease-out 1.0s backwards;
    }
    .p2-borrar:active {
      background-image: url("Assets/Pagina_2/Boton_3_P.svg");
      transform: translateY(2px) scale(0.98);
    }

    /* ===== Compartidos con la pantalla 1 ===== */
    .logo-ls {
      position: fixed; top: 3%; left: 1%; width: 14%;
      z-index: 4; cursor: pointer;
      animation: p1-in 0.7s ease-out 0.15s backwards;
    }
    .logo-ls img { display: block; width: 100%; height: auto; transition: transform 0.15s ease; }
    .logo-ls:hover img { transform: scale(1.04); }
    .p1-footer {
      position: fixed; left: 3%; bottom: 3.5%; z-index: 4;
      display: flex; flex-direction: column; gap: 10px;
      animation: p1-in 0.7s ease-out 1.1s backwards;
    }
    .p1-social { display: flex; gap: 14px; align-items: center; }
    .p1-social a { display: block; transition: transform 0.15s ease; }
    .p1-social a:hover { transform: scale(1.15); }
    .p1-social img { width: 2vw; height: auto; display: block; }
    .p1-legal  { display: flex; gap: 18px; align-items: flex-end; }
    .p1-legal img { height: 1.5vw; width: auto; display: block; }

    /* ===================== MOBILE (portrait) ===================== */
    @media (max-width: 768px) {
      .bg-comp { --fx: 30%; }                       /* mobile: encuadra al diablo */
      .logo-ls  { top: 2%; left: 0; right: 0; margin-left: auto; margin-right: auto; width: 42%; }

      .p2-titulo { left: 0; right: 0; margin-left: auto; margin-right: auto;
                   top: 18%; width: 88vw; }
      .p2-panel  { left: 0; right: 0; margin-left: auto; margin-right: auto;
                   top: 27%; width: 92vw; height: auto; aspect-ratio: 580 / 644; }
      .p2-slogan { display: none; }                /* Haztodo: se oculta para no chocar con el recuadro */

      /* Botones ENVIAR / BORRAR centrados como par, debajo del recuadro */
      .p2-enviar { left: 2vw;  right: auto; top: 77%; width: 47vw; }
      .p2-borrar { left: 51vw; right: auto; top: 77%; width: 47vw; }

      .p1-footer { left: 0; right: 0; bottom: 2.5%; gap: 14px; align-items: center; }
      .p1-social { gap: 22px; justify-content: center; }
      .p1-social img { width: 8vw; }
      .p1-legal  { gap: 4vw; justify-content: center; }
      .p1-legal img { height: 3.4vw; }
    }
  </style>
</head>
<body>
  <!-- Fondo: capas de atrás hacia adelante (biblioteca, humo, diablo, humo hasta el pecho) -->
  <div class="bg-comp" aria-hidden="true">
    <div class="bg-stage">
      <img src="Assets/01/Fondo.png"  style="--x:0;   --y:0;   --w:1920" data-depth="40" alt="" />
      <canvas class="bg-humo humo-atras" width="960" height="540" data-depth="32"></canvas>
      <img src="Assets/02/Diablo.png" style="--x:226; --y:161; --w:685"  data-depth="24" alt="" />
      <canvas class="bg-humo humo-adelante" width="960" height="540" data-depth="12"></canvas>
    </div>
  </div>

  <!-- Elementos Pagina_2 -->
  <img class="p2-panel"  src="Assets/Pagina_2/Recuadro.svg" alt="" />
  <img class="p2-titulo" src="Assets/Pagina_2/Ingresa.svg" alt="Ingresa tus datos" />
  <img class="p2-slogan" src="Assets/Pagina_2/Haztodo.svg" alt="Haz todo, haz nada" />

  <div class="p2-enviar">
    <div class="p2-enviar-pulse">
      <button type="button" class="p2-enviar-btn" aria-label="Enviar"></button>
    </div>
  </div>
  <button type="button" class="p2-borrar" aria-label="Borrar"></button>

  <!-- Compartidos con pantalla 1 -->
  <a class="logo-ls" href="index.html" aria-label="Volver al inicio"><img src="Assets/Logo_LS.webp" alt="Limón Soda" /></a>
  <div class="p1-footer">
    <div class="p1-social">
      <a href="https://www.youtube.com/@LShaztodohaznada" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><img src="Assets/Pagina_1/YT.svg" alt="YouTube" /></a>
      <a href="https://www.tiktok.com/@limonsodacl" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><img src="Assets/Pagina_1/TT.svg" alt="TikTok" /></a>
      <a href="https://www.instagram.com/limonsodacl/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="Assets/Pagina_1/IG.svg" alt="Instagram" /></a>
    </div>
    <div class="p1-legal">
      <img src="Assets/Pagina_1/Bases.svg" alt="Bases legales" />
      <img src="Assets/Pagina_1/Terminos.svg" alt="Términos y condiciones" />
    </div>
  </div>

  <script src="humo.js"></script>
  <script>
    // ENVIAR (Boton_2) -> pantalla de gracias
    document.querySelector('.p2-enviar-btn').addEventListener('click', () => {
      window.location.href = 'gracias.html';
    });

    // Parallax horizontal del fondo (igual que en el index).
    // data-depth = desplazamiento máximo en px del lienzo 1920×1080 con el mouse en el borde.
    const bgStage = document.querySelector('.bg-stage');
    const bgLayers = Array.from(bgStage.querySelectorAll('[data-depth]'));
    let bgTarget = 0, bgX = 0, bgRaf = 0;
    const stepBg = () => {
      bgX += (bgTarget - bgX) * 0.08;
      if (Math.abs(bgTarget - bgX) < 0.0005) bgX = bgTarget;
      const u = bgStage.offsetWidth / 1920;
      bgLayers.forEach(layer => {
        layer.style.transform = `translate3d(${(bgX * layer.dataset.depth * u).toFixed(2)}px, 0, 0)`;
      });
      bgRaf = bgX === bgTarget ? 0 : requestAnimationFrame(stepBg);
    };
    window.addEventListener('mousemove', (e) => {
      bgTarget = (e.clientX / window.innerWidth - 0.5) * 2;
      if (!bgRaf) bgRaf = requestAnimationFrame(stepBg);
    });

    // Humo detrás del diablo: nace a los costados de su silueta (el diablo ocupa x 226–911)
    // y sube rodeando hombros y cabeza
    crearHumo(document.querySelector('.humo-atras'), {
      cantidad: 40,
      zonas: [[-100, 330, 0.4], [700, 1250, 0.45], [1250, 2000, 0.15]],
      y: [200, 850], subida: [10, 25], deriva: 14,
      tamano: [260, 420], crece: [10, 25], vida: [20, 30], opacidad: [0.35, 0.5],
    });

    // Humo delante del diablo: niebla baja que le llega hasta el pecho (y ≈ 600–720)
    crearHumo(document.querySelector('.humo-adelante'), {
      cantidad: 34,
      zonas: [[100, 1050, 0.85], [1050, 1600, 0.15]],
      y: [700, 1150], subida: [3, 10], deriva: 20,
      tamano: [320, 500], crece: [8, 18], vida: [18, 28], opacidad: [0.3, 0.45],
      techo: [590, 730],
    });
  </script>
</body>
</html>
